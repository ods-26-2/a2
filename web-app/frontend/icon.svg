<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fundo Único do Crachá (Sem container duplo) -->
  <rect width="512" height="512" rx="96" fill="#0E1013" />

  <!-- Tarja de Identificação Institucional Superior -->
  <path d="M 0,0 L 512,0 L 512,96 L 0,96 Z" fill="#2563EB" clip-path="url(#topClip)" />
  <defs>
    <clipPath id="topClip">
      <rect width="512" height="512" rx="96" />
    </clipPath>
  </defs>

  <!-- Fenda do Cordão / Presilha do Crachá -->
  <rect x="206" y="36" width="100" height="24" rx="12" fill="#0E1013" />

  <!-- Área Central do QR Code Único e Direto -->
  <rect x="76" y="136" width="360" height="320" rx="32" fill="#171A21" />

  <!-- Módulos do QR Code em Branco Puro e Alto Contraste -->
  <!-- Marcador Canto Superior Esquerdo -->
  <rect x="116" y="176" width="80" height="80" rx="14" fill="#FFFFFF" />
  <rect x="132" y="192" width="48" height="48" rx="8" fill="#171A21" />
  <rect x="144" y="204" width="24" height="24" rx="4" fill="#2563EB" />

  <!-- Marcador Canto Superior Direito -->
  <rect x="316" y="176" width="80" height="80" rx="14" fill="#FFFFFF" />
  <rect x="332" y="192" width="48" height="48" rx="8" fill="#171A21" />
  <rect x="344" y="204" width="24" height="24" rx="4" fill="#2563EB" />

  <!-- Marcador Canto Inferior Esquerdo -->
  <rect x="116" y="336" width="80" height="80" rx="14" fill="#FFFFFF" />
  <rect x="132" y="352" width="48" height="48" rx="8" fill="#171A21" />
  <rect x="144" y="364" width="24" height="24" rx="4" fill="#2563EB" />

  <!-- Matriz de Dados Geométrica Central e Conexões -->
  <rect x="220" y="176" width="24" height="24" rx="4" fill="#FFFFFF" />
  <rect x="268" y="176" width="24" height="24" rx="4" fill="#FFFFFF" />
  <rect x="220" y="224" width="24" height="48" rx="4" fill="#FFFFFF" />
  <rect x="268" y="224" width="24" height="24" rx="4" fill="#FFFFFF" />

  <!-- Bloco Central Destaque -->
  <rect x="244" y="272" width="48" height="48" rx="8" fill="#2563EB" />

  <!-- Lado Direito e Inferior -->
  <rect x="316" y="280" width="48" height="24" rx="4" fill="#FFFFFF" />
  <rect x="372" y="280" width="24" height="48" rx="4" fill="#FFFFFF" />
  <rect x="316" y="336" width="24" height="48" rx="4" fill="#FFFFFF" />
  <rect x="364" y="352" width="32" height="24" rx="4" fill="#FFFFFF" />
  <rect x="336" y="392" width="60" height="24" rx="4" fill="#FFFFFF" />

  <!-- Padrão Inferior Centro -->
  <rect x="220" y="336" width="24" height="80" rx="4" fill="#FFFFFF" />
  <rect x="268" y="352" width="24" height="24" rx="4" fill="#FFFFFF" />
  <rect x="268" y="392" width="24" height="24" rx="4" fill="#FFFFFF" />
</svg>
